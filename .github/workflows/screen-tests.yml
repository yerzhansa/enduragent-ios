name: Screen tests

on:
  pull_request:
    paths:
      - apps/ios/**
      - tools/**
      - .github/workflows/screen-tests.yml

permissions:
  contents: read

concurrency:
  group: screen-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install pinned XcodeGen
        run: |
          curl --fail --location --output /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  /tmp/xcodegen.zip' | shasum -a 256 -c -
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          echo /tmp/xcodegen/xcodegen/bin >> "$GITHUB_PATH"
      - name: Build the app and the screen test runner
        run: swift run --quiet --package-path tools sim build
      - name: Run the smoke set
        run: swift run --quiet --package-path tools sim shard smoke FirstConversationProof FailureNoticesProof ReviewProof HistoryArchivedProof AccessNoticeProof
      - name: Print the per-class times
        if: always()
        run: cat "$HOME/Library/Logs/enduragent-verify/smoke/summary.json"
