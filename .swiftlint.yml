included:
  - apps/ios

excluded:
  - apps/ios/Packages/EnduragentCoach/.build
  - apps/ios/Packages/EnduragentCoach/Sources/EnduragentCoach/I18n/CatalogKey.generated.swift

only_rules:
  - custom_rules
  - fatal_error_message
  - file_length
  - force_cast
  - force_try
  - force_unwrapping
  - implicitly_unwrapped_optional
  - todo
  - unhandled_throwing_task
  - unused_optional_binding

force_unwrapping:
  ignored_literal_argument_functions: []

custom_rules:
  starter_policy_in_package:
    included: 'apps/ios/Enduragent/.*\.swift$'
    regex: '\.\s*grant\s*\(\s*deviceCheck\s*:'
    message: 'Claim starter credits through Coach.claimStarter(deviceCheck:) so the package owns the grant policy.'
    severity: error
  one_session_factory:
    included: 'apps/ios/(?:Enduragent|Packages/EnduragentCoach/Sources)/'
    excluded: 'Packages/EnduragentCoach/Sources/EnduragentCoach/Transport/HTTPSession\.swift$'
    regex: '\bURLSessionConfiguration\b|\bURLSession\s*(?:\(|\.\s*(?:shared|init)\b)|(?<![\w)\]?!])\.(?:shared\b|init\(\s*configuration:)'
    match_kinds: [identifier, typeidentifier]
    message: 'Build every URLSession through ephemeralSession in Transport/HTTPSession.swift.'
    severity: error
  no_comments:
    regex: '//|/\*'
    match_kinds: [comment, doccomment, comment.url, comment.mark]
    excluded: 'Package\.swift$'
    message: 'Comments are not allowed. Rename, split, or restructure the code instead.'
    severity: error
  swallowed_error:
    regex: 'catch\s*(?:let\s+\w+\s*)?\{\s*(?:(?:return|break|continue)(?:[ \t]+(?:nil|\[\]|\[:\]|""|false|true|0|\.none))?|_\s*=\s*\w+|throw\s+CancellationError\s*\(\s*\))?\s*\}'
    message: 'This catch discards every error. Handle it, surface it to the user, or let it propagate. Catch a specific error type to ignore it on purpose.'
    severity: error
  optional_try:
    regex: '(?m)^(?![ \t]*if let [A-Za-z_][A-Za-z_0-9]*[ \t]*=[ \t]*try\?[ \t]+container\.decode\([A-Za-z_0-9\[\]: ]+\.self\)[ \t]*\{[ \t]*$)[^\n]*\btry\?'
    message: 'try? turns a failure into nil. Use try and handle or propagate the error. Only probing decodes on a Decoder container may use try?.'
    severity: error
  no_print:
    regex: '\b(?:print|debugPrint|NSLog)\s*\(|\bdump\s*\((?!(?:[^()"]|"(?:\\.|[^"\\])*"|\([^()]*\))*?,\s*to\s*:)'
    match_kinds: [identifier]
    message: 'Console output does not ship. Surface the state in the UI or in a test.'
    severity: error
  view_owns_no_transport:
    included: 'apps/ios/Enduragent/(?!App/).*\.swift$'
    regex: '\b(?:URLSession|JSONDecoder|JSONEncoder)\b'
    match_kinds: [identifier, typeidentifier]
    message: 'Views read snapshots and send intents. Networking and JSON belong in EnduragentCoach or apps/ios/Enduragent/App.'
    severity: error
  hardcoded_ui_string:
    included: 'apps/ios/Enduragent/.*\.swift$'
    excluded: 'DebugView\.swift$'
    regex: '\b(?:Text|Button|Label|Toggle|Section|TextField|SecureField|Link|Menu|Picker|LabeledContent|ContentUnavailableView|navigationTitle|alert|confirmationDialog|accessibilityLabel|accessibilityHint)\(\s*(?:verbatim:\s*)?"|String\(localized:|LocalizedStringKey\('
    message: 'Athlete-facing copy goes through the catalog. Use phrasebook.say(Catalog.key) and add the English string to packages/i18n/catalogs/en.json.'
    severity: error
