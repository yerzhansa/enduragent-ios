name: Enduragent
options:
  bundleIdPrefix: icu.enduragent
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_STYLE: Automatic
  SWIFT_VERSION: "6.0"
packages:
  EnduragentCoach:
    path: Packages/EnduragentCoach
targets:
  Enduragent:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Enduragent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: icu.enduragent.ios
        PRODUCT_NAME: Enduragent
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Enduragent
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Enduragent/Enduragent.entitlements
    entitlements:
      path: Enduragent/Enduragent.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.icu.enduragent.ios
        com.apple.developer.icloud-services:
          - CloudKit
        keychain-access-groups:
          - $(AppIdentifierPrefix)icu.enduragent.ios
    dependencies:
      - package: EnduragentCoach
  EnduragentTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: EnduragentTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: icu.enduragent.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Enduragent.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Enduragent
        BUNDLE_LOADER: $(TEST_HOST)
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: Enduragent
  EnduragentUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: EnduragentUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: icu.enduragent.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Enduragent
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: Enduragent
schemes:
  Enduragent:
    build:
      targets:
        Enduragent: all
        EnduragentTests: [test]
        EnduragentUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EnduragentTests
        - EnduragentUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  EnduragentCoach:
    build:
      targets:
        Enduragent: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: EnduragentCoach/EnduragentCoachTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
